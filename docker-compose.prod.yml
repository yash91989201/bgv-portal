name: bgv-portal

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:?VITE_CONVEX_URL is required}
        VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL:?VITE_CONVEX_SITE_URL is required}
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      VITE_CONVEX_URL: ${VITE_CONVEX_URL}
      VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL}
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
